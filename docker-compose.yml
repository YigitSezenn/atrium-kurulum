services:
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    pull_policy: always
    container_name: yt-cipher
    restart: unless-stopped
    environment:
      - OVERRIDE_PLAYER_VARIANT=IAS

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    container_name: lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx384M
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    ports:
      - "127.0.0.1:2333:2333"
    depends_on:
      - yt-cipher

  atrium:
    build: .
    container_name: atrium
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      LAVALINK_URL: http://lavalink:2333
      LAVALINK_PASSWORD: atrium-ses
    depends_on:
      - lavalink
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./bots:/app/bots
